<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #111; max-width: 480px; margin: 0 auto; padding: 24px;">
    <h2 style="margin: 0 0 16px;">Sign in to brandbid</h2>
    <p>Tap the button to sign in. The link works once and expires in an hour.</p>
    <p style="margin: 24px 0;">
      <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
         style="background: #111; color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none; display: inline-block;">
        Sign in
      </a>
    </p>
    <p style="font-size: 13px; color: #555;">If you didn't ask for this, you can ignore this email. Nobody can sign in without this link.</p>
  </body>
</html>
